# One command: docker compose up --build   ->  UI on http://localhost:3000
services:
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-password123}
    ports: ["7474:7474", "7687:7687"]
    volumes: [neo4j_data:/data]
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p $${NEO4J_AUTH#neo4j/} 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build:
      context: ./backend
      args:
        INSTALL_DOCLING: ${INSTALL_DOCLING:-false}
    env_file: [.env]
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-password123}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      neo4j: {condition: service_healthy}
    ports: ["8000:8000"]

  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["3000:80"]

volumes:
  neo4j_data:
